name: Chat Application CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Automated tests and integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pytest

      - name: Compile Python application
        run: python -m compileall -q App

      - name: Check browser JavaScript syntax
        run: node --check App/static/browser_features.js

      - name: Run each pytest module in an isolated process
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          test_files=(tests/test_*.py)
          if [ ${#test_files[@]} -eq 0 ]; then
            echo "No tests/test_*.py files were found." >&2
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "::group::${test_file}"
            python -m pytest -q "$test_file"
            echo "::endgroup::"
          done

      - name: Run HTTP and WebSocket integration checks
        run: python tests/run_integration_tests.py

  scalability-benchmark:
    name: NFR-02 simulated scalability benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run 100,000-user virtual benchmark
        run: |
          mkdir -p benchmark-output
          python App/scalability.py --users 100000 --messages 9200 --nodes 4 --no-persist > benchmark-output/scalability_benchmark_report.json
          python -m json.tool benchmark-output/scalability_benchmark_report.json > /dev/null

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: scalability-benchmark-report
          path: benchmark-output/scalability_benchmark_report.json
          if-no-files-found: error
          retention-days: 30
