<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat Application - Sprint 1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background: #121826; color: #fff; }
        #sidebar { width: 320px; background: #1a2332; border-right: 1px solid #2e3b52; display: flex; flex-direction: column; }
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #0f141d; }
        .header { padding: 15px; background: #232d3f; font-weight: bold; border-bottom: 1px solid #2e3b52; display: flex; justify-content: space-between; align-items: center; }
        #contacts-list, #messages-list { flex: 1; overflow-y: auto; padding: 15px; }
        .contact-item { padding: 12px; margin-bottom: 8px; background: #232d3f; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .contact-item:hover { background: #2c3a52; }
        .contact-item.active { background: #007bff; }
        .message { margin-bottom: 12px; max-width: 65%; padding: 10px 14px; border-radius: 8px; position: relative; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .message.sent { background: #005c4b; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 0; }
        .message.received { background: #202c33; align-self: flex-start; margin-right: auto; border-bottom-left-radius: 0; }
        .message-status { font-size: 11px; margin-left: 6px; float: right; color: #8696a0; }
        .message-status.read { color: #53bdeb; }
        #input-area { padding: 15px; background: #1a2332; border-top: 1px solid #2e3b52; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #2e3b52; background: #0f141d; color: #fff; outline: none; }
        button { padding: 10px 18px; border: none; background: #007bff; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .search-box { padding: 10px; background: #1a2332; border-bottom: 1px solid #2e3b52; }
        #add-contact-dialog { width: min(400px, calc(100% - 32px)); margin: auto; padding: 20px; border: 1px solid #2e3b52; border-radius: 8px; background: #1a2332; color: #fff; }
        #add-contact-dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
        #add-contact-form { display: flex; flex-direction: column; gap: 12px; }
        #add-contact-form input { padding: 10px; border: 1px solid #2e3b52; border-radius: 6px; background: #0f141d; color: #fff; }
        #add-contact-actions { display: flex; justify-content: flex-end; gap: 8px; }
        #add-contact-error { color: #ff8080; font-size: 13px; }
 
        /* --- Login / Registration screen --- */
        #auth-screen { position: fixed; inset: 0; z-index: 2000; background: #121826; display: flex; align-items: center; justify-content: center; padding: 16px; }
        #auth-screen[hidden] { display: none; }
        .auth-card { width: min(400px, 100%); background: #1a2332; border: 1px solid #2e3b52; border-radius: 10px; padding: 28px; }
        .auth-card h1 { font-size: 22px; margin-bottom: 18px; }
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
        .auth-tabs button { flex: 1; background: #232d3f; }
        .auth-tabs button.active { background: #007bff; }
        .auth-form { display: flex; flex-direction: column; gap: 6px; }
        .auth-form[hidden] { display: none; }
        .auth-form label { font-size: 13px; color: #8696a0; margin-top: 6px; }
        .auth-form input { padding: 10px; border: 1px solid #2e3b52; border-radius: 6px; background: #0f141d; color: #fff; outline: none; }
        .auth-form input:focus { border-color: #007bff; }
        .auth-form .primary { margin-top: 14px; }
        .auth-error { color: #ff8080; font-size: 13px; margin-top: 8px; }
        .auth-info { color: #5fd38d; font-size: 13px; margin-top: 8px; }
        .hint { font-size: 12px; color: #8696a0; }
    </style>
</head>
<body>
    <!-- Login / Registration -->
    <div id="auth-screen">
        <div class="auth-card">
            <h1>Chat App</h1>
            <div class="auth-tabs">
                <button type="button" id="tab-login" class="active" onclick="showAuthTab('login')">Log in</button>
                <button type="button" id="tab-register" onclick="showAuthTab('register')">Register</button>
            </div>
 
            <form id="login-form" class="auth-form" onsubmit="handleLogin(event)" novalidate>
                <label for="login-username">Username</label>
                <input id="login-username" type="text" autocomplete="username">
                <label for="login-password">Password</label>
                <input id="login-password" type="password" autocomplete="current-password">
                <p id="login-info" class="auth-info" role="status" hidden></p>
                <p id="login-error" class="auth-error" role="alert" hidden></p>
                <button id="login-submit" class="primary" type="submit">Log in</button>
            </form>
 
            <form id="register-form" class="auth-form" onsubmit="handleRegister(event)" novalidate hidden>
                <label for="register-username">Username</label>
                <input id="register-username" type="text" autocomplete="username">
                <label for="register-email">Email</label>
                <input id="register-email" type="text" autocomplete="email">
                <label for="register-password">Password</label>
                <input id="register-password" type="password" autocomplete="new-password">
                <p class="hint">At least 8 characters with upper-case, lower-case and a number.</p>
                <p id="register-error" class="auth-error" role="alert" hidden></p>
                <button id="register-submit" class="primary" type="submit">Register</button>
            </form>
        </div>
    </div>
 
    <div id="sidebar">
        <div class="header">
            <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:13px;">User: <b id="current-user-label"></b></span>
                <button onclick="logout()" style="padding: 4px 8px; font-size: 11px; background: #dc3545;">Logout</button>
            </div>
            <button onclick="openAddContactDialog()" style="padding: 5px 10px; font-size: 12px; background: #28a745;">+ Add</button>
        </div>
        <div class="search-box">
            <input type="text" id="global-search" placeholder="Search contacts or messages..." onkeyup="handleSearch()">
        </div>
        <div id="pending-requests" style="padding: 10px; border-bottom: 1px solid #2e3b52;"></div>
        <div id="contacts-list"></div>
    </div>
    <div id="chat-area">
        <div class="header" id="chat-header">Select a contact to begin messaging</div>
        <div id="messages-list"></div>
        <div id="input-area">
            <input type="file" id="file-input" style="display:none;" onchange="uploadFile()">
            <button onclick="document.getElementById('file-input').click()">&#128206;</button>
            <input type="text" id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
 
    <dialog id="add-contact-dialog">
        <form id="add-contact-form" onsubmit="addContact(event)">
            <h2>Add a contact</h2>
            <label for="add-contact-username">Username</label>
            <input id="add-contact-username" type="text" autocomplete="off" required>
            <p id="add-contact-error" role="alert" hidden></p>
            <div id="add-contact-actions">
                <button type="button" onclick="closeAddContactDialog()">Cancel</button>
                <button id="add-contact-submit" type="submit" style="background:#28a745;">Add</button>
            </div>
        </form>
    </dialog>
 
    <!-- High Z-Index Isolated Lightbox Modal (FIXED FOR ISSUE #29) -->
    <div id="image-modal" onclick="closeModal(event)" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.92); z-index:999999; justify-content:center; align-items:center; cursor:pointer;">
        <span onclick="closeModal(event)" style="position:absolute; top:20px; right:30px; font-size:40px; color:#ffffff; font-weight:bold; cursor:pointer; z-index:1000000; user-select:none;">&times;</span>
        <img id="modal-img" src="" onclick="event.stopPropagation()" style="max-width:90vw; max-height:90vh; border-radius:8px; box-shadow:0 0 30px rgba(0,0,0,0.95); object-fit:contain; cursor:default;">
    </div>
 
    <script>
        let currentUser = null;
        let activeContact = null;
        let ws = null;
 
        // ================= Authentication & session handling =================
        const TOKEN_KEY = 'chat_token';
        let authToken = null;
        let sessionSeconds = 1800;      // replaced by the server's expires_in
        let lastActivity = Date.now();
        let lastRefresh = 0;
        let idleTimer = null;
 
        // Attach the session token to every /api call (except login/register)
        // and return to the login screen if the server says the session is gone.
        const rawFetch = window.fetch.bind(window);
        window.fetch = async function(url, opts = {}) {
            const isApi = typeof url === 'string' && url.startsWith('/api/');
            const isPublic = isApi && (url.startsWith('/api/login') || url.startsWith('/api/register'));
            if (isApi && !isPublic && authToken) {
                opts.headers = Object.assign({}, opts.headers, { Authorization: 'Bearer ' + authToken });
            }
            const response = await rawFetch(url, opts);
            if (isApi && !isPublic && response.status === 401 && authToken) {
                endSession('Session expired. Please log in again.');
            }
            return response;
        };
 
        function storeToken(token) {
            try { token ? localStorage.setItem(TOKEN_KEY, token) : localStorage.removeItem(TOKEN_KEY); } catch (e) {}
        }
 
        function readStoredToken() {
            try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
        }
 
        function applySession(data) {
            authToken = data.token;
            sessionSeconds = data.expires_in || sessionSeconds;
            lastRefresh = Date.now();
            storeToken(authToken);
        }
 
        function setText(id, text) {
            const el = document.getElementById(id);
            el.textContent = text || '';
            el.hidden = !text;
        }
 
        function showAuthTab(tab) {
            const login = tab === 'login';
            document.getElementById('login-form').hidden = !login;
            document.getElementById('register-form').hidden = login;
            document.getElementById('tab-login').classList.toggle('active', login);
            document.getElementById('tab-register').classList.toggle('active', !login);
            setText('login-error', ''); setText('register-error', '');
        }
 
        function showLoginScreen(infoMessage) {
            document.getElementById('auth-screen').hidden = false;
            showAuthTab('login');
            document.getElementById('login-password').value = '';
            setText('login-info', infoMessage || '');
        }
 
        async function postJson(url, body) {
            const response = await window.fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            let data = {};
            try { data = await response.json(); } catch (e) {}
            if (!response.ok) {
                const detail = Array.isArray(data.detail) ? 'Please check the form fields.' : data.detail;
                throw new Error(detail || `Request failed (HTTP ${response.status}).`);
            }
            return data;
        }
 
        async function handleLogin(event) {
            event.preventDefault();
            const button = document.getElementById('login-submit');
            setText('login-error', ''); setText('login-info', '');
            button.disabled = true;
            try {
                const data = await postJson('/api/login', {
                    username: document.getElementById('login-username').value,
                    password: document.getElementById('login-password').value
                });
                applySession(data);
                currentUser = data.username;
                startApp();
            } catch (error) {
                setText('login-error', error.message);
            } finally {
                button.disabled = false;
            }
        }
 
        async function handleRegister(event) {
            event.preventDefault();
            const button = document.getElementById('register-submit');
            setText('register-error', '');
            button.disabled = true;
            try {
                const username = document.getElementById('register-username').value.trim();
                await postJson('/api/register', {
                    username: username,
                    email: document.getElementById('register-email').value,
                    password: document.getElementById('register-password').value
                });
                // Redirect to login after successful registration
                document.getElementById('register-form').reset();
                showLoginScreen('Registration successful. Please log in.');
                document.getElementById('login-username').value = username;
                document.getElementById('login-password').focus();
            } catch (error) {
                setText('register-error', error.message);
            } finally {
                button.disabled = false;
            }
        }
 
        function startApp() {
            document.getElementById('auth-screen').hidden = true;
            document.getElementById('current-user-label').textContent = currentUser;
            activeContact = null;
            document.getElementById('chat-header').innerText = 'Select a contact to begin messaging';
            document.getElementById('messages-list').innerHTML = '';
            lastActivity = Date.now();
            initWebSocket();
            loadContacts();
            clearInterval(idleTimer);
            idleTimer = setInterval(checkIdle, 10000);
        }
 
        function endSession(message) {
            clearInterval(idleTimer);
            if (ws) { ws.onmessage = null; ws.onclose = null; ws.close(); ws = null; }
            authToken = null;
            currentUser = null;
            activeContact = null;
            storeToken(null);
            document.getElementById('messages-list').innerHTML = '';
            document.getElementById('contacts-list').innerHTML = '';
            showLoginScreen(message);
        }
 
        async function logout() {
            try { await window.fetch('/api/logout', { method: 'POST' }); } catch (e) {}
            endSession('You have been logged out.');
        }
 
        // Idle timeout: expire the session after inactivity (30 minutes by default).
        function checkIdle() {
            if (authToken && Date.now() - lastActivity > sessionSeconds * 1000) {
                endSession('Session expired due to inactivity. Please log in again.');
            }
        }
 
        async function refreshSession() {
            lastRefresh = Date.now();
            try {
                const response = await window.fetch('/api/session');
                if (response.ok) applySession(await response.json());
            } catch (e) {}
        }
 
        function trackActivity() {
            if (!authToken) return;
            lastActivity = Date.now();
            if (Date.now() - lastRefresh > 60000) refreshSession();   // keep the token alive while active
        }
 
        async function restoreSession() {
            const stored = readStoredToken();
            if (!stored) { showLoginScreen(); return; }
            try {
                const response = await rawFetch('/api/session', { headers: { Authorization: 'Bearer ' + stored } });
                if (response.status === 401) {
                    // Expired, invalid or logged-out session: never grant silent access.
                    storeToken(null);
                    showLoginScreen('Session expired. Please log in again.');
                    return;
                }
                if (!response.ok) throw new Error('server error');
                const data = await response.json();
                applySession(data);
                currentUser = data.username;
                startApp();   // back in the account without re-entering credentials
            } catch (e) {
                // Server unreachable: keep the saved session for the next attempt.
                showLoginScreen('Could not reach the server. Please try again.');
            }
        }
 
        // ================= Chat application =================
        function initWebSocket() {
            const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${scheme}://${window.location.host}/ws/${currentUser}?token=${encodeURIComponent(authToken)}`);
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleIncomingSignal(data);
            };
            ws.onclose = function(event) {
                // 4401 = missing/expired/invalid session, 4403 = token belongs to another user
                if (authToken && (event.code === 4401 || event.code === 4403)) {
                    endSession('Session expired. Please log in again.');
                }
            };
        }
 
        // --- Contact Management JS Functions ---
        function openAddContactDialog() {
            const dialog = document.getElementById('add-contact-dialog');
            const errorMessage = document.getElementById('add-contact-error');
            document.getElementById('add-contact-username').value = '';
            errorMessage.hidden = window.location.protocol !== 'file:';
            if (window.location.protocol === 'file:') {
                errorMessage.textContent = 'Open the chat app from its server at http://127.0.0.1:8000/; opening index.html directly blocks API requests.';
            }
            dialog.showModal();
            document.getElementById('add-contact-username').focus();
        }
 
        function closeAddContactDialog() {
            document.getElementById('add-contact-dialog').close();
        }
 
        async function addContact(event) {
            event.preventDefault();
            const submitButton = document.getElementById('add-contact-submit');
            const errorMessage = document.getElementById('add-contact-error');
            const contactName = document.getElementById('add-contact-username').value.trim();
            if (!contactName) return;
 
            if (window.location.protocol === 'file:') {
                errorMessage.textContent = 'Open the chat app from its server at http://127.0.0.1:8000/; opening index.html directly blocks API requests.';
                errorMessage.hidden = false;
                return;
            }
 
            submitButton.disabled = true;
            errorMessage.hidden = true;
 
            try {
                const response = await fetch('/api/contacts/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser,
                        contact_username: contactName
                    })
                });
                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch {
                    throw new Error(`The server returned an unexpected response (HTTP ${response.status}).`);
                }
 
                if (!response.ok || !data.success) {
                    throw new Error(data.error || data.detail || "Failed to add contact");
                }
 
                closeAddContactDialog();
                alert(data.message);
                await loadContacts();
            } catch (error) {
                errorMessage.textContent = error.message || "Failed to add contact. Please try again.";
                errorMessage.hidden = false;
            } finally {
                submitButton.disabled = false;
            }
        }
 
        async function loadContacts() {
            loadPendingRequests(); // Load pending requests concurrently
            
            const response = await fetch(`/api/contacts/${currentUser}`);
            const data = await response.json();
            const listElement = document.getElementById('contacts-list');
            listElement.innerHTML = '';
            
            if (!data.contacts || data.contacts.length === 0) {
                listElement.innerHTML = '<div style="padding:10px; color:#8696a0; font-size:12px;">No contacts found. Click "+ Add" above to add contacts.</div>';
                return;
            }
 
            data.contacts.forEach(contact => {
                const item = document.createElement('div');
                item.className = `contact-item ${activeContact === contact ? 'active' : ''}`;
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';
                
                item.innerHTML = `
                    <span onclick="selectContact('${contact}')" style="flex:1;">&#128100; ${contact}</span>
                    <button onclick="removeContact('${contact}')" style="background:none; border:none; color:#ff4d4d; cursor:pointer; font-size:14px;" title="Remove Contact">❌</button>
                `;
                listElement.appendChild(item);
            });
        }
 
        async function loadPendingRequests() {
            const response = await fetch(`/api/contacts/pending/${currentUser}`);
            const data = await response.json();
            const container = document.getElementById('pending-requests');
            container.innerHTML = '';
 
            if (data.pending && data.pending.length > 0) {
                container.innerHTML = '<div style="font-size:11px; font-weight:bold; color:#ffc107; margin-bottom:5px;">PENDING FRIEND REQUESTS</div>';
                data.pending.forEach(reqUser => {
                    const reqDiv = document.createElement('div');
                    reqDiv.style.cssText = 'background:#232d3f; padding:8px; border-radius:4px; margin-bottom:5px; display:flex; justify-size:space-between; align-items:center; font-size:12px;';
                    reqDiv.innerHTML = `
                        <span>&#128100; ${reqUser}</span>
                        <div>
                            <button onclick="respondRequest('${reqUser}', 'accept')" style="padding:2px 6px; font-size:10px; background:#28a745;">Accept</button>
                            <button onclick="respondRequest('${reqUser}', 'decline')" style="padding:2px 6px; font-size:10px; background:#dc3545;">Decline</button>
                        </div>
                    `;
                    container.appendChild(reqDiv);
                });
            }
        }
 
        async function respondRequest(requester, action) {
            await fetch('/api/contacts/respond', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUser, requester_id: requester, action: action })
            });
            loadContacts();
        }
 
        async function removeContact(contactName) {
            if (!confirm(`Are you sure you want to remove ${contactName} from your contacts?`)) return;
 
            await fetch('/api/contacts/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUser, contact_username: contactName })
            });
 
            if (activeContact === contactName) {
                activeContact = null;
                document.getElementById('chat-header').innerText = 'Select a contact to begin messaging';
                document.getElementById('messages-list').innerHTML = '';
            }
            loadContacts();
        }
 
        function selectContact(contact) {
            activeContact = contact;
            document.getElementById('chat-header').innerText = `Chatting with: ${contact}`;
            loadContacts();
            loadHistory(); // Load stored history (ADDED FOR ISSUE #23)
        }
 
        // --- Fetch Chat History from SQLite (ADDED FOR ISSUE #23) ---
        async function loadHistory() {
            if (!activeContact) return;
            const response = await fetch(`/api/messages/history/${currentUser}/${activeContact}`);
            const data = await response.json();
            
            const list = document.getElementById('messages-list');
            list.innerHTML = '';
            
            if (data.history) {
                data.history.forEach(msg => {
                    appendMessageUI(msg.sender, msg.content, msg.timestamp, msg.status, msg.msg_id);
                });
            }
        }
 
        // --- Receive Text Message Event Handler (ADDED FOR ISSUE #20) ---
        function handleIncomingSignal(data) {
            if (data.type === "receive_message") {
                if (activeContact === data.sender) {
                    appendMessageUI(data.sender, data.content, data.timestamp, 'delivered', data.msg_id);
                    
                    // Send Read Receipt ACK back to sender (ADDED FOR ISSUE #22)
                    ws.send(JSON.stringify({
                        type: "read_ack",
                        msg_id: data.msg_id,
                        sender: data.sender,
                        reader: currentUser
                    }));
                } else {
                    alert(`New message from ${data.sender}!`);
                }
            }
            // Update Checkmark Visual State (ADDED FOR ISSUE #22)
            else if (data.type === "status_update") {
                const statusElem = document.getElementById(`status-${data.msg_id}`);
                if (statusElem) {
                    if (data.status === 'delivered') {
                        statusElem.innerHTML = '&#10003;&#10003;';
                    } else if (data.status === 'read') {
                        statusElem.innerHTML = '&#10003;&#10003;';
                        statusElem.className = 'message-status read';
                    }
                }
            }
        }
 
        // --- Global Search Engine & Term Highlighting (UPDATED FOR ISSUE #31) ---
        async function handleSearch() {
            const searchInput = document.getElementById('global-search');
            const query = searchInput.value.trim();
            const listElement = document.getElementById('contacts-list');
 
            // If query is emptied, restore standard contacts view
            if (!query || query.length === 0) {
                loadContacts();
                return;
            }
 
            try {
                const response = await fetch(`/api/search?username=${currentUser}&q=${encodeURIComponent(query)}`);
                const data = await response.json();
 
                listElement.innerHTML = '';
 
                // 1. Render Contact Matches Section
                if (data.contacts && data.contacts.length > 0) {
                    const contactHeader = document.createElement('div');
                    contactHeader.style.cssText = 'padding:6px 10px; font-size:11px; font-weight:bold; color:#ffc107; background:#1e293b; border-radius:4px; margin-bottom:6px;';
                    contactHeader.innerText = `CONTACTS (${data.contacts.length})`;
                    listElement.appendChild(contactHeader);
 
                    data.contacts.forEach(contact => {
                        const item = document.createElement('div');
                        item.className = `contact-item ${activeContact === contact ? 'active' : ''}`;
                        item.innerHTML = `👤 ${highlightSearchTerm(contact, query)}`;
                        item.onclick = () => selectContact(contact);
                        listElement.appendChild(item);
                    });
                }
 
                // 2. Render Message History Search Matches Section
                if (data.messages && data.messages.length > 0) {
                    const msgHeader = document.createElement('div');
                    msgHeader.style.cssText = 'padding:6px 10px; font-size:11px; font-weight:bold; color:#53bdeb; background:#1e293b; border-radius:4px; margin-top:10px; margin-bottom:6px;';
                    msgHeader.innerText = `MESSAGES FOUND (${data.messages.length})`;
                    listElement.appendChild(msgHeader);
 
                    data.messages.forEach(msg => {
                        const otherUser = (msg.sender === currentUser) ? msg.recipient : msg.sender;
                        const item = document.createElement('div');
                        item.className = 'contact-item';
                        item.style.fontSize = '12px';
                        item.innerHTML = `
                            <div style="display:flex; justify-content:space-between; color:#8696a0; font-size:10px;">
                                <span>💬 Chat with: ${otherUser}</span>
                                <span>${msg.timestamp}</span>
                            </div>
                            <div style="margin-top:4px; color:#fff; word-break:break-word;">
                                ${highlightSearchTerm(msg.content, query)}
                            </div>
                        `;
                        item.onclick = () => {
                            selectContact(otherUser);
                        };
                        listElement.appendChild(item);
                    });
                }
 
                if ((!data.contacts || data.contacts.length === 0) && (!data.messages || data.messages.length === 0)) {
                    listElement.innerHTML = '<div style="padding:15px; color:#8696a0; font-size:12px; text-align:center;">No matching contacts or messages found.</div>';
                }
            } catch (err) {
                console.error("Search execution error:", err);
            }
        }
 
        function highlightSearchTerm(text, query) {
            if (!query) return text;
            const re = new RegExp(`(${query})`, 'gi');
            return text.replace(re, '<mark style="background:#ffc107; color:#000; padding:0 2px; border-radius:2px; font-weight:bold;">$1</mark>');
        }
 
        function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            
            if (!content || !activeContact) {
                if(!activeContact) alert("Please select a contact first!");
                return;
            }
 
            const msgId = 'msg-' + Date.now();
            const payload = {
                type: "send_message",
                msg_id: msgId,
                sender: currentUser,
                recipient: activeContact,
                content: content,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
 
            ws.send(JSON.stringify(payload));
            appendMessageUI(currentUser, content, payload.timestamp, 'sent', msgId);
            input.value = '';
        }
 
        function appendMessageUI(sender, content, timeStr, status, msgId) {
            const list = document.getElementById('messages-list');
            const msgDiv = document.createElement('div');
            const isSent = (sender === currentUser);
            msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
            msgDiv.id = `msg-${msgId}`;
            
            let statusHTML = isSent ? `<span class="message-status" id="status-${msgId}">&#10003;</span>` : '';
            msgDiv.innerHTML = `<div>${content}</div><div style="font-size:10px; opacity:0.7; text-align:right;">${timeStr} ${statusHTML}</div>`;
            
            list.appendChild(msgDiv);
            list.scrollTop = list.scrollHeight;
        }
 
        // --- Global Scope Lightbox Modal Functions (FIXED FOR ISSUE #29) ---
        window.openModal = function(src) {
            if (!src) return;
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = src;
            modal.style.display = 'flex';
        };
 
        window.closeModal = function(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            modal.style.display = 'none';
            modalImg.src = '';
        };
 
        // --- Global Document-Level Click Interceptor (PREVENTS EVENT BUBBLING & STATE RESET) ---
        document.addEventListener('click', function(e) {
            const imgTarget = e.target.closest('#messages-list img');
            if (imgTarget) {
                e.preventDefault();
                e.stopPropagation(); // Stops click from resetting activeContact or refreshing UI
                window.openModal(imgTarget.src);
            }
        }, true);
 
        // --- Refactored Drag & Drop + File Upload Engine (UPDATED FOR ISSUE #29) ---
        async function uploadFile(droppedFile = null) {
            const fileInput = document.getElementById('file-input');
            let file = droppedFile;
 
            if (!file) {
                if (!fileInput.files || fileInput.files.length === 0) return;
                file = fileInput.files[0];
            }
            
            if (!activeContact) {
                alert("Please select a contact before uploading files!");
                fileInput.value = '';
                return;
            }
 
            const formData = new FormData();
            formData.append("file", file);
 
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
 
                if (result.success) {
                    const isImage = file.type.startsWith('image/');
                    let formattedContent = "";
 
                    if (isImage) {
                        formattedContent = `<div style="margin-top:4px;"><img src="${result.file_url}" alt="${result.filename}" style="max-width:260px; max-height:260px; border-radius:8px; display:block; border:1px solid #2e3b52; cursor:pointer;" title="Click to expand"></div>`;
                    } else {
                        formattedContent = `<div style="margin-top:4px;"><a href="${result.file_url}" target="_blank" download="${result.filename}" style="color:#53bdeb; text-decoration:underline; font-weight:bold;">📎 Download ${result.filename}</a></div>`;
                    }
 
                    const msgId = 'msg-' + Date.now();
                    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const payload = {
                        type: "send_message",
                        msg_id: msgId,
                        sender: currentUser,
                        recipient: activeContact,
                        content: formattedContent,
                        timestamp: timeStr
                    };
 
                    ws.send(JSON.stringify(payload));
                    appendMessageUI(currentUser, formattedContent, timeStr, 'sent', msgId);
                } else {
                    alert("File upload failed!");
                }
            } catch (err) {
                console.error("Upload error:", err);
                alert("Error uploading file to server.");
            } finally {
                fileInput.value = '';
            }
        }
 
        // --- Global Chat Image Event Delegation (ADDED TO FIX BLANK MODAL & BUBBLING) ---
        function initImageEventDelegation() {
            const messagesList = document.getElementById('messages-list');
            messagesList.addEventListener('click', function(e) {
                if (e.target && e.target.tagName === 'IMG') {
                    e.stopPropagation();
                    openModal(e.target.src);
                }
            });
        }
 
        // --- Drag and Drop Event Listeners (ADDED FOR ISSUE #29 ENHANCEMENT) ---
        function initDragAndDrop() {
            const chatArea = document.getElementById('chat-area');
 
            chatArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                chatArea.style.outline = '2px dashed #007bff';
                chatArea.style.outlineOffset = '-10px';
                chatArea.style.background = '#141c2b';
            });
 
            chatArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                chatArea.style.outline = 'none';
                chatArea.style.background = '#0f141d';
            });
 
            chatArea.addEventListener('drop', (e) => {
                e.preventDefault();
                chatArea.style.outline = 'none';
                chatArea.style.background = '#0f141d';
 
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    uploadFile(e.dataTransfer.files[0]);
                }
            });
        }
 
        window.addEventListener('storage', function(event) {
            if (event.key !== TOKEN_KEY) return;
            if (!event.newValue && authToken) {
                endSession('You have been logged out.');
            } else if (event.newValue && authToken) {
                authToken = event.newValue;   // another tab refreshed the session
            }
        });
 
        window.onload = function() {
            initDragAndDrop();
            initImageEventDelegation();
            ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach(name =>
                document.addEventListener(name, trackActivity, { passive: true, capture: true })
            );
            restoreSession();   // shows the app if a valid token exists, otherwise the login screen
        };
    </script>
</body>
</html>
