<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Socket Chat</title>
<style>
:root{--bg:#0f141d;--side:#1a2332;--panel:#232d3f;--line:#2e3b52;--blue:#1684ff;--green:#075e4b;--text:#f5f7fb;--muted:#a5b1c2}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--text);font:14px "Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:7px;background:var(--blue);color:white;padding:8px 11px;cursor:pointer}button.secondary{background:#344258}button.danger{background:#a93442}input,select,textarea{background:#101722;color:white;border:1px solid var(--line);border-radius:7px;padding:9px;min-width:0}#sidebar{width:310px;min-width:235px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}.topbar,.header{padding:13px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.topbar{flex-wrap:wrap}.topbar select{max-width:130px}.search{padding:9px;border-bottom:1px solid var(--line)}.search input{width:100%}.section-title{display:flex;justify-content:space-between;align-items:center;padding:10px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase}.list{overflow:auto;padding:6px 9px}.contact-item{padding:10px;border-radius:8px;background:var(--panel);margin-bottom:7px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}.contact-item.active,.contact-item:hover{background:#174a80}.grow{flex:1;min-height:0}#chat-area{flex:1;min-width:0;display:flex;flex-direction:column}.chat-title{font-weight:700}.subtitle{font-size:12px;color:#69c8ff;margin-top:4px;min-height:14px}#messages-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px}.message{max-width:min(75%,650px);padding:10px 12px;border-radius:10px;overflow-wrap:anywhere;background:#202c33}.message.sent{align-self:flex-end;background:var(--green)}.message.received{align-self:flex-start}.message.deleted{font-style:italic;color:#c2cad5;background:#29313e}.message-content{white-space:pre-wrap}.message-meta{display:flex;justify-content:flex-end;gap:7px;font-size:10px;color:#d0d7df;margin-top:5px}.message-status.read{color:#75d8ff}.edited-label{font-style:italic}.message-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;margin-top:7px}.message-actions button{font-size:11px;padding:5px 7px}#input-area{display:flex;gap:8px;padding:12px;background:var(--side);border-top:1px solid var(--line)}#message-input{flex:1}#file-input{display:none}.empty{color:var(--muted);padding:15px;text-align:center}.modal-backdrop{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}.modal{width:min(500px,100%);max-height:85vh;overflow:auto;background:var(--side);border:1px solid var(--line);border-radius:12px;padding:18px}.modal h2{margin:0 0 14px;font-size:18px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{color:var(--muted);font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.member-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}.member-row button{font-size:11px;padding:5px}.toast{position:fixed;right:16px;bottom:16px;background:#26364a;border:1px solid var(--line);padding:12px;border-radius:8px;display:none;z-index:20}@media(max-width:650px){#sidebar{width:38%;min-width:130px}.topbar{align-items:stretch;flex-direction:column}.topbar select{max-width:none;width:100%}.message{max-width:92%}.header{padding:9px}}
</style></head>
<body>
<aside id="sidebar">
 <div class="topbar"><label for="user-select">User</label><select id="user-select" onchange="switchAccount(this.value)"></select><button onclick="addContactPrompt()">+ Add</button></div>
 <div class="search"><input id="global-search" placeholder="Search contacts or messages…" oninput="handleSearch()"></div>
 <div id="pending-requests"></div>
 <div class="section-title"><span>Groups</span><button onclick="openCreateGroup()">+ New</button></div><div id="groups-list" class="list" style="max-height:30%"></div>
 <div class="section-title">Contacts</div><div id="contacts-list" class="list grow"></div>
</aside>
<main id="chat-area">
 <header class="header"><div><div id="chat-title" class="chat-title">Select a contact or group</div><div id="typing-indicator" class="subtitle"></div></div><button id="group-info-button" class="secondary" hidden onclick="openGroupSettings()">Group info</button></header>
 <div id="messages-list"><div class="empty">Choose a conversation to start messaging.</div></div>
 <div id="input-area"><input type="file" id="file-input" onchange="uploadFile()"><button class="secondary" onclick="document.getElementById('file-input').click()">📎</button><input id="message-input" placeholder="Type a message…" oninput="typingChanged()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"><button onclick="sendMessage()">Send</button></div>
</main>
<div id="modal-backdrop" class="modal-backdrop"><div class="modal"><h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-actions" class="modal-actions"></div></div></div><div id="toast" class="toast"></div>
<script>
let currentUser="shrujan",activeContact=null,activeGroup=null,ws=null,typingTimer=null,typingSent=false,retry=1000,closing=false;
let contacts=[],groups=[],messages=new Map();
const $=id=>document.getElementById(id), key=()=>activeGroup?activeGroup.group_id:(activeContact?[currentUser,activeContact].sort().join("|"):"");
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||"Request failed");return d}
function emit(o){if(ws?.readyState===WebSocket.OPEN){ws.send(JSON.stringify(o));return true}toast("Connecting; please try again.");return false}
function connect(){closing=false;ws=new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws/${encodeURIComponent(currentUser)}`);ws.onopen=()=>{retry=1000};ws.onmessage=e=>{try{signal(JSON.parse(e.data))}catch(err){console.error(err)}};ws.onclose=()=>{if(!closing){setTimeout(connect,retry);retry=Math.min(retry*2,10000)}}}
async function loadUsers(){const d=await api("/api/users");$("user-select").replaceChildren();d.users.forEach(u=>{let o=document.createElement("option");o.value=u;o.textContent=u;o.selected=u===currentUser;$("user-select").append(o)})}
async function switchAccount(u){if(!u||u===currentUser)return;closing=true;ws?.close();currentUser=u;activeContact=activeGroup=null;messages.clear();$("chat-title").textContent="Select a contact or group";$("messages-list").replaceChildren();$("group-info-button").hidden=true;connect();await Promise.all([loadContacts(),loadGroups()])}
async function addContactPrompt(){const name=prompt("Username to add:");if(!name?.trim())return;try{await api("/api/contacts/add",{method:"POST",body:JSON.stringify({user_id:currentUser,contact_username:name.trim()})});await loadUsers();await pendingRequests();toast("Request sent")}catch(e){toast(e.message)}}
async function loadContacts(){try{contacts=(await api(`/api/contacts/${encodeURIComponent(currentUser)}`)).contacts;renderContacts();await pendingRequests()}catch(e){toast(e.message)}}
function renderContacts(){const root=$("contacts-list");root.replaceChildren();if(!contacts?.length){root.innerHTML='<div class="empty">No contacts. Use + Add.</div>';return}contacts.forEach(c=>{const row=document.createElement("div");row.className="contact-item"+(activeContact===c&&!activeGroup?" active":"");const label=document.createElement("span");label.textContent="👤 "+c;label.style.flex="1";label.onclick=()=>selectContact(c);const del=document.createElement("button");del.textContent="×";del.className="secondary";del.onclick=async()=>{if(!confirm("Remove contact?"))return;try{await api("/api/contacts/remove",{method:"POST",body:JSON.stringify({user_id:currentUser,contact_username:c})});contacts=contacts.filter(x=>x!==c);renderContacts()}catch(e){toast(e.message)}};row.append(label,del);root.append(row)})}
async function pendingRequests(){try{const d=await api(`/api/contacts/pending/${encodeURIComponent(currentUser)}`),root=$("pending-requests");root.replaceChildren();d.pending.forEach(u=>{const row=document.createElement("div");row.className="contact-item";const label=document.createElement("span");label.textContent="Request: "+u;row.append(label);["accept","decline"].forEach(a=>{const b=document.createElement("button");b.textContent=a==="accept"?"✓":"×";b.className=a==="accept"?"":"danger";b.onclick=async()=>{try{await api("/api/contacts/respond",{method:"POST",body:JSON.stringify({user_id:currentUser,requester_id:u,action:a})});await loadContacts()}catch(e){toast(e.message)}};row.append(b)});root.append(row)})}catch(e){console.error(e)}}
async function loadGroups(){try{groups=(await api(`/api/groups/${encodeURIComponent(currentUser)}`)).groups;renderGroups()}catch(e){toast(e.message)}}
function renderGroups(){const root=$("groups-list");root.replaceChildren();if(!groups?.length){root.innerHTML='<div class="empty">No groups yet.</div>';return}groups.forEach(g=>{const row=document.createElement("div");row.className="contact-item"+(activeGroup?.group_id===g.group_id?" active":"");row.textContent=`${g.icon} ${g.name}`;row.onclick=()=>selectGroup(g);root.append(row)})}
function modal(title,build,actions){$("modal-title").textContent=title;const body=$("modal-body"),buttons=$("modal-actions");body.replaceChildren();buttons.replaceChildren();build(body);actions.forEach(a=>{const b=document.createElement("button");b.textContent=a.label;b.className=a.cls||"";b.onclick=a.click;buttons.append(b)});$("modal-backdrop").style.display="flex"}
function closeModal(){$("modal-backdrop").style.display="none"}
async function openCreateGroup(){let name,icon,select;modal("Create group",body=>{for(const [label,kind] of [["Group name","name"],["Icon emoji","icon"]]){const f=document.createElement("div");f.className="field";const l=document.createElement("label");l.textContent=label;const i=document.createElement("input");i.value=kind==="icon"?"👥":"";if(kind==="name")name=i;else icon=i;f.append(l,i);body.append(f)}const f=document.createElement("div");f.className="field";const l=document.createElement("label");l.textContent="Members (Ctrl-select multiple)";select=document.createElement("select");select.multiple=true;select.size=5;contacts.forEach(u=>{const o=document.createElement("option");o.value=u;o.textContent=u;select.append(o)});f.append(l,select);body.append(f)},[{label:"Cancel",cls:"secondary",click:closeModal},{label:"Create",click:async()=>{try{if(!name.value.trim())return toast("Group name required");await api("/api/groups",{method:"POST",body:JSON.stringify({creator:currentUser,name:name.value,icon:icon.value,members:[...select.selectedOptions].map(o=>o.value)})});closeModal();await loadGroups();toast("Group created")}catch(e){toast(e.message)}}}])}
async function selectContact(c){activeContact=c;activeGroup=null;$("chat-title").textContent=c;$("group-info-button").hidden=true;$("typing-indicator").textContent="";renderContacts();renderGroups();await history()}
async function selectGroup(g){activeGroup=g;activeContact=null;$("chat-title").textContent=`${g.icon} ${g.name}`;$("group-info-button").hidden=false;$("typing-indicator").textContent="";renderContacts();renderGroups();await history()}
async function history(){messages.clear();$("messages-list").replaceChildren();if(!activeContact&&!activeGroup)return;try{const url=activeGroup?`/api/groups/${activeGroup.group_id}/history?username=${encodeURIComponent(currentUser)}`:`/api/messages/history/${encodeURIComponent(currentUser)}/${encodeURIComponent(activeContact)}`;const d=await api(url);d.history.forEach(draw);for(const m of messages.values())if(m.sender!==currentUser)emit({type:"read_ack",msg_id:m.msg_id})}catch(e){toast(e.message)}}
function renderMessageContent(container,text){container.replaceChildren();const lines=String(text??"").split("\n");lines.forEach((line,index)=>{if(index)container.append(document.createElement("br"));const match=line.match(/^(.*?)(https?:\/\/\S+)(.*?)$/);if(!match){container.append(document.createTextNode(line));return}container.append(document.createTextNode(match[1]));let url;try{url=new URL(match[2])}catch{container.append(document.createTextNode(match[2]+match[3]));return}if(url.protocol!=="http:"&&url.protocol!=="https:"){container.append(document.createTextNode(match[2]+match[3]));return}const a=document.createElement("a");a.href=url.href;a.textContent=match[2];a.target="_blank";a.rel="noopener noreferrer";a.style.color="#8bc8ff";container.append(a,document.createTextNode(match[3]))})}
function draw(m){if(!m?.msg_id)return;if(m.group_id&&activeGroup?.group_id!==m.group_id)return;if(!m.group_id&&activeContact&&m.conversation_type==="private"&&![m.sender,m.recipient].includes(activeContact))return;messages.set(m.msg_id,m);const old=document.getElementById("msg-"+CSS.escape(m.msg_id));old?.remove();const deleted=m.deleted_everyone||m.content==="This message was deleted.";const article=document.createElement("article");article.id="msg-"+m.msg_id;article.className="message "+(m.sender===currentUser?"sent":"received")+(deleted?" deleted":"");const content=document.createElement("div");content.className="message-content";renderMessageContent(content,deleted?"This message was deleted.":m.content);article.append(content);const meta=document.createElement("div");meta.className="message-meta";if(m.edited){const e=document.createElement("span");e.className="edited-label";e.textContent="Edited";meta.append(e)}const time=document.createElement("span");time.textContent=m.timestamp||"";meta.append(time);if(m.sender===currentUser&&!deleted){const status=document.createElement("span");status.id="status-"+m.msg_id;status.className="message-status";status.textContent=m.status==="read"?"✓✓":"✓";meta.append(status)}article.append(meta);if(!deleted){const actions=document.createElement("div");actions.className="message-actions";if(m.sender===currentUser){const edit=document.createElement("button");edit.className="secondary";edit.textContent="Edit";edit.onclick=()=>editMessage(m.msg_id);actions.append(edit)}const me=document.createElement("button");me.className="secondary";me.textContent="Delete for me";me.onclick=()=>deleteMessage(m.msg_id,"me");actions.append(me);if(m.sender===currentUser){const all=document.createElement("button");all.className="danger";all.textContent="Delete for everyone";all.onclick=()=>deleteMessage(m.msg_id,"everyone");actions.append(all)}article.append(actions)}$("messages-list").append(article);$("messages-list").scrollTop=$("messages-list").scrollHeight}
function sendMessage(){const input=$("message-input"),content=input.value.trim();if(!content)return;if(!activeContact&&!activeGroup)return toast("Select a conversation first");const m={type:"send_message",msg_id:crypto.randomUUID(),content,timestamp:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};if(activeGroup)m.group_id=activeGroup.group_id;else m.recipient=activeContact;if(emit(m)){draw({...m,sender:currentUser,recipient:activeContact,group_id:activeGroup?.group_id||null,conversation_type:activeGroup?"group":"private",conversation_id:key(),status:"sent"});input.value="";stopTyping()}}
function editMessage(id){const m=messages.get(id);if(!m)return;let input;modal("Edit message",body=>{input=document.createElement("textarea");input.value=m.content;input.rows=4;input.style.width="100%";body.append(input)},[{label:"Cancel",cls:"secondary",click:closeModal},{label:"Save",click:()=>{if(!input.value.trim())return toast("Message cannot be empty");if(emit({type:"edit_message",msg_id:id,content:input.value.trim()})){m.content=input.value.trim();m.edited=true;draw(m);closeModal()}}}])}
function deleteMessage(id,scope){if(!confirm(scope==="everyone"?"Delete for everyone?":"Delete for me?"))return;if(emit({type:"delete_message",msg_id:id,scope})){if(scope==="me"){document.getElementById("msg-"+CSS.escape(id))?.remove();messages.delete(id)}else{const m=messages.get(id);if(m){m.content="This message was deleted.";m.deleted_everyone=true;draw(m)}}}}
function typingChanged(){if(!activeContact&&!activeGroup)return;if(!typingSent){const p={type:"typing"};if(activeGroup)p.group_id=activeGroup.group_id;else p.recipient=activeContact;emit(p);typingSent=true}clearTimeout(typingTimer);typingTimer=setTimeout(stopTyping,1000)}
function stopTyping(){clearTimeout(typingTimer);if(!typingSent)return;const p={type:"stop_typing"};if(activeGroup)p.group_id=activeGroup.group_id;else p.recipient=activeContact;emit(p);typingSent=false}
function signal(d){if(d.type==="error")return toast(d.message);if(d.type==="groups_changed"){loadGroups();return}if(d.type==="status_update"){const e=document.getElementById("status-"+CSS.escape(d.msg_id));if(e){e.textContent=d.status==="sent"?"✓":"✓✓";if(d.status==="read")e.classList.add("read")}return}if(d.type==="typing"||d.type==="stop_typing"){const match=activeGroup?d.group_id===activeGroup.group_id:(!d.group_id&&d.username===activeContact);if(match)$("typing-indicator").textContent=d.type==="typing"?`${d.username} is typing…`:"";return}if(d.type==="message_edit"){const m=messages.get(d.msg_id);if(m){m.content=d.content;m.edited=true;draw(m)}else if(activeContact||activeGroup)history();return}if(d.type==="message_delete"){if(d.scope==="me"){document.getElementById("msg-"+CSS.escape(d.msg_id))?.remove();messages.delete(d.msg_id)}else{const m=messages.get(d.msg_id);if(m){m.content="This message was deleted.";m.deleted_everyone=true;draw(m)}else if(activeContact||activeGroup)history()}return}if(d.type==="receive_message"){const relevant=d.conversation_type==="group"?activeGroup?.group_id===d.group_id:activeContact&&[d.sender,d.recipient].includes(activeContact);if(relevant){draw(d);emit({type:"read_ack",msg_id:d.msg_id})}else toast(`New message from ${d.sender}`)}}
async function openGroupSettings(){if(!activeGroup)return;try{const d=await api(`/api/groups/${activeGroup.group_id}/members?username=${encodeURIComponent(currentUser)}`);modal(`${d.group.icon} ${d.group.name}`,body=>{const p=document.createElement("p");p.textContent=`Creator: ${d.group.creator}`;body.append(p);if(activeGroup.role==="admin"){const name=document.createElement("input");name.value=d.group.name;name.placeholder="Group name";name.style.width="100%";body.append(name);const rename=document.createElement("button");rename.textContent="Rename";rename.onclick=async()=>{try{await api(`/api/groups/${activeGroup.group_id}/rename`,{method:"POST",body:JSON.stringify({username:currentUser,value:name.value})});closeModal();await loadGroups()}catch(e){toast(e.message)}};body.append(rename);const icon=document.createElement("input");icon.value=d.group.icon;icon.placeholder="Icon emoji";icon.style.width="100%";body.append(icon);const iconBtn=document.createElement("button");iconBtn.textContent="Change icon";iconBtn.onclick=async()=>{try{await api(`/api/groups/${activeGroup.group_id}/icon`,{method:"POST",body:JSON.stringify({username:currentUser,value:icon.value})});closeModal();await loadGroups()}catch(e){toast(e.message)}};body.append(iconBtn);const target=document.createElement("input");target.placeholder="Username to add";target.style.width="100%";body.append(target);const add=document.createElement("button");add.textContent="Add member";add.onclick=async()=>{try{await api(`/api/groups/${activeGroup.group_id}/members/add`,{method:"POST",body:JSON.stringify({username:currentUser,target:target.value.trim()})});closeModal();openGroupSettings()}catch(e){toast(e.message)}};body.append(add)}d.members.forEach(m=>{const row=document.createElement("div");row.className="member-row";const label=document.createElement("span");label.textContent=`${m.username} (${m.role})`;row.append(label);if(activeGroup.role==="admin"&&m.username!==d.group.creator){const remove=document.createElement("button");remove.className="danger";remove.textContent="Remove";remove.onclick=async()=>{try{await api(`/api/groups/${activeGroup.group_id}/members/remove`,{method:"POST",body:JSON.stringify({username:currentUser,target:m.username})});closeModal();openGroupSettings()}catch(e){toast(e.message)}};row.append(remove);const role=document.createElement("button");role.className="secondary";role.textContent=m.role==="admin"?"Demote":"Make admin";role.onclick=async()=>{try{if(m.role==="admin")await api(`/api/groups/${activeGroup.group_id}/admins/${encodeURIComponent(m.username)}?username=${encodeURIComponent(currentUser)}`,{method:"DELETE"});else await api(`/api/groups/${activeGroup.group_id}/admins`,{method:"POST",body:JSON.stringify({username:currentUser,target:m.username})});closeModal();openGroupSettings()}catch(e){toast(e.message)}};row.append(role)}body.append(row)})},[{label:"Close",cls:"secondary",click:closeModal}])}catch(e){toast(e.message)}}
async function uploadFile(){const input=$("file-input"),file=input.files?.[0];if(!file)return;if(!activeContact&&!activeGroup){toast("Select a conversation first");input.value="";return}const form=new FormData();form.append("file",file);try{const r=await fetch("/api/upload",{method:"POST",body:form}),d=await r.json();if(!r.ok)throw Error(d.detail||"Upload failed");const content=`${file.type.startsWith("image/")?"Image":"File"}: ${d.filename}\n${location.origin}${d.file_url}`;const p={type:"send_message",msg_id:crypto.randomUUID(),content,timestamp:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};if(activeGroup)p.group_id=activeGroup.group_id;else p.recipient=activeContact;emit(p)}catch(e){toast(e.message)}finally{input.value=""}}
async function handleSearch(){const q=$("global-search").value.trim();if(!q){renderContacts();renderGroups();return}try{const d=await api(`/api/search?username=${encodeURIComponent(currentUser)}&q=${encodeURIComponent(q)}`),root=$("contacts-list");root.replaceChildren();d.contacts.forEach(c=>{const x=document.createElement("div");x.className="contact-item";x.textContent="👤 "+c;x.onclick=()=>selectContact(c);root.append(x)});d.messages.forEach(m=>{const x=document.createElement("div");x.className="contact-item";x.textContent=`${m.sender}: ${m.content}`;x.onclick=()=>m.group_id?selectGroup(groups.find(g=>g.group_id===m.group_id)):selectContact(m.sender===currentUser?m.recipient:m.sender);root.append(x)})}catch(e){toast(e.message)}}
$("modal-backdrop").addEventListener("click",e=>{if(e.target===$("modal-backdrop"))closeModal()});window.addEventListener("beforeunload",()=>{closing=true;ws?.close()});window.onload=async()=>{try{await loadUsers();connect();await Promise.all([loadContacts(),loadGroups()])}catch(e){toast(e.message)}};
</script></body></html>
